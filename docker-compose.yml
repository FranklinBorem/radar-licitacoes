# Sobe apenas o banco de dados PostgreSQL para desenvolvimento.
# Usa a porta 5433 no seu computador para nao conflitar com outro PostgreSQL ja instalado.
services:
  banco:
    image: postgres:16
    container_name: radar-banco
    environment:
      POSTGRES_USER: radar
      POSTGRES_PASSWORD: radar
      POSTGRES_DB: radar
    ports:
      - "5434:5432"
    volumes:
      - radar_dados:/var/lib/postgresql/data

volumes:
  radar_dados:
